<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digital Detective</title>
    <meta name="description" content="Solve eight forensic cases by typing real shell and git commands in a simulated Linux terminal. Learn grep, pipes, sha256sum, git log, reflog, blame and more.">
    <meta property="og:title" content="Digital Detective">
    <meta property="og:description" content="A detective game you play by typing real shell and git commands.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://scavengerterminal.netlify.app/">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2">
    <script src="/js/core.js?v=2" defer></script>
    <script src="/js/shell.js?v=2" defer></script>
    <script src="/js/git.js?v=2" defer></script>
    <script src="/js/cases.js?v=2" defer></script>
    <script src="/js/game.js?v=2" defer></script>
</head>
<body class="crt">
    <a class="skip" href="#cmd">Skip to the command line</a>

    <header class="top">
        <h1 class="brand"><span class="brand-mark" aria-hidden="true">&gt;_</span><span class="brand-text">Digital Detective</span></h1>
        <button id="caseChip" class="chip" type="button" title="Choose a case">Loading</button>
        <div class="top-right">
            <span class="score"><span class="score-label">Score </span><b id="score">0</b><span class="score-label"> pts</span></span>
            <button id="btnCases" class="btn btn-ghost" type="button">Cases</button>
            <button id="btnPanel" class="btn" type="button" aria-controls="panel" aria-expanded="true">Case file<span id="panelBadge" class="badge">0/0</span></button>
            <button id="btnCrt" class="btn btn-ghost" type="button" aria-pressed="true" title="Scanlines and glow">CRT</button>
        </div>
    </header>

    <main class="layout">
        <section class="term" aria-label="Terminal">
            <div id="screen" class="screen">
                <div id="out" role="log" aria-live="polite"></div>
                <form id="promptForm" class="prompt" autocomplete="off">
                    <label id="ps1" class="ps1" for="cmd">detective@nightjar:~$</label>
                    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
                </form>
            </div>
            <div id="keys" class="keys" role="group" aria-label="Extra keys">
                <button type="button" data-key="Tab">Tab</button>
                <button type="button" data-key="Up" aria-label="Previous command">Up</button>
                <button type="button" data-key="Down" aria-label="Next command">Down</button>
                <button type="button" data-key="|">|</button>
                <button type="button" data-key="-">-</button>
                <button type="button" data-key="/">/</button>
                <button type="button" data-key="~">~</button>
                <button type="button" data-key="..">..</button>
                <button type="button" data-key='"'>"</button>
                <button type="button" data-key=">">&gt;</button>
            </div>
        </section>

        <aside id="panel" class="panel" aria-label="Case file">
            <div class="panel-head">
                <div>
                    <h2 id="caseTitle">Case</h2>
                    <p id="caseMeta" class="meta"></p>
                </div>
                <button id="panelClose" class="icon-btn" type="button" aria-label="Close the case file">&times;</button>
            </div>
            <p id="brief" class="brief"></p>
            <h3>Questions</h3>
            <ol id="questions" class="questions"></ol>
            <h3>Objectives <span id="objCount"></span></h3>
            <ul id="objectives" class="objectives"></ul>
            <h3>Commands for this case</h3>
            <p class="meta">Click one to put it on the command line. Edit it, then press Enter.</p>
            <ul id="cheats" class="cheats"></ul>
            <div class="panel-actions">
                <button id="restartCase" class="btn btn-ghost" type="button">Restart this case</button>
            </div>
        </aside>
    </main>

    <dialog id="casesDlg" aria-labelledby="casesTitle">
        <div class="dlg-head">
            <h2 id="casesTitle">Cases</h2>
            <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button>
        </div>
        <div id="caseList"></div>
        <p id="totalLine" class="meta"></p>
        <div class="dlg-foot">
            <button id="resetAll" class="btn btn-danger" type="button">Reset all progress</button>
        </div>
    </dialog>

    <dialog id="doneDlg" aria-labelledby="doneTitle">
        <h2 id="doneTitle">Case closed</h2>
        <div id="doneStars"></div>
        <p id="doneScore"></p>
        <h3>What you practised</h3>
        <ul id="doneLearned"></ul>
        <div class="dlg-foot">
            <button class="btn btn-ghost" type="button" data-close>Keep exploring</button>
            <button id="doneNext" class="btn" type="button">Next case</button>
        </div>
    </dialog>

    <noscript><p style="padding:16px">Digital Detective needs JavaScript: the whole terminal runs in your browser.</p></noscript>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
